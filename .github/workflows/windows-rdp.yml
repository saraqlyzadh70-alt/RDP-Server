name: RDP via AnyDesk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable RDP & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue

      - name: 3. Download and Run AnyDesk
        run: |
          Invoke-WebRequest "https://download.anydesk.com/AnyDesk.exe" -OutFile "C:\AnyDesk.exe"-OutFile "C:\AnyDesk.exe"
          Start-Process -FilePath "C:\AnyDesk.exe" -ArgumentList "--start-with-win --silent" -Wait
          Start-Sleep -Seconds 10
          $ad_id = & "C:\AnyDesk.exe" --get-id
          & "C:\AnyDesk.exe" --set-password "P@ssw0rd1qazXSW@#"
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  AnyDesk ID  : $ad_id" -ForegroundColor Yellow
          Write-Host "  Password    : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "  >> Download AnyDesk on your phone and enter the ID" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep Server Alive
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Server running..."
          }
